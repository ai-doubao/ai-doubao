    <path d="M56 49H102 M56 251H555 M608 251H1064" fill="none" stroke="#86A0CC" stroke-opacity=".38"/>
    <circle cx="115" cy="49" r="3" fill="#FFC77B"/>
    <text x="134" y="55" fill="#D4DFF4" font-family="ui-monospace, Consolas, monospace" font-size="17" letter-spacing="3">NOT THE DOUBAO.</text>
    <text x="55" y="173" fill="#FFF8ED" font-family="system-ui, 'Segoe UI', sans-serif" font-size="100" font-weight="800" letter-spacing="2">DOUBAO</text>
    <text x="60" y="221" fill="#FFC77B" font-family="ui-monospace, Consolas, monospace" font-size="24" font-weight="600" letter-spacing="3">SHOW ME THE LOGS.</text>
    <g transform="translate(859 150)">
