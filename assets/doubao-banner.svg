      <path d="M62-80h75a14 14 0 0 1 14 14v21a14 14 0 0 1-14 14H84L65-20l5-11h-8a14 14 0 0 1-14-14v-21a14 14 0 0 1 14-14Z" fill="#15243F" stroke="#FFD28E" stroke-width="2"/>
      <path d="M75-64l8 8-8 8m18 0h25" fill="none" stroke="#FFD28E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-90" cy="52" r="4" fill="#FFC77B"/>
