<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Doubao — Show me the logs.</title>
  <desc id="desc">The Doubao wordmark and a skeptical amber bean mascot on a midnight-blue drafting grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0C1425"/>
      <stop offset="1" stop-color="#172642"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FFE39B"/>
      <stop offset="1" stop-color="#FFAA62"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A6BDEB" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="card">
      <rect width="1120" height="300" rx="26"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
